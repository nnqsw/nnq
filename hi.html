<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website của Quang</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 50px 20px;
        }

        h1 {
            font-size: 40px;
        }

        .content {
            padding: 50px;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Xin chào 👋</h1>
        <p>Đây là website của tôi</p>
    </header>

    <div class="content">
        <h2>Giới thiệu</h2>
        <p>Chào mừng bạn đến với trang web của tôi.</p>

        <button onclick="alert('Xin chào!')">
            Bấm vào đây
        </button>
    </div>

</body>
</html>
